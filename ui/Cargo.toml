[package]
name = "sav_ui"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
# Sur wasm, reqwest s'appuie sur fetch() du navigateur: pas de backend TLS.
reqwest = { version = "0.11", default-features = false, features = ["json"] }
console_error_panic_hook = "0.1"
yew = { version = "0.23.0", features = ["csr"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "Element", "UrlSearchParams", "HtmlTextAreaElement"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[build-dependencies]
toml = "1"
