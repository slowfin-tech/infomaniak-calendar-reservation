name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build + tests du serveur, puis binaire musl statique (artefact pour l'image)
  server:
    name: Serveur (tests + binaire musl)
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --locked
      - name: Binaire statique musl (x86_64)
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo build --release --locked --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: sav-server-binary
          path: target/x86_64-unknown-linux-musl/release/sav_server
          retention-days: 7
          if-no-files-found: error

  # Tests du module wasm + bundle statique (artefact pour l'image)
  ui:
    name: Module wasm (tests + bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests (Node, sans navigateur)
        run: cd ui && wasm-pack test --node
      - name: Bundle statique (build wasm + copie dans static/)
        run: make ui-build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-static
          path: ui/static/
          retention-days: 7

  # Image Docker: binaire precompile (pas de compilation Rust dans le
  # conteneur, build ~1 min), push vers GHCR hors pull requests.
  docker:
    name: Image Docker (GHCR)
    needs: [server, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sav-server-binary
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ui-static
          path: ui/static
      - name: Permissions du binaire
        run: chmod +x dist/sav_server
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sav-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ci
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
