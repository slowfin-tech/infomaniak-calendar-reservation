name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Tests (serveur + module wasm) et artefacts: binaires musl (amd64 + arm64)
  # et bundle UI.
  build:
    name: Tests + artefacts (binaires musl, bundle UI)
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Zig pour le cross-compile musl aarch64 (cargo-zigbuild).
      - uses: mlugg/setup-zig@v1
      - name: Tests serveur
        run: cargo test --locked
      - name: Tests module wasm (Node, sans navigateur)
        run: cd ui && wasm-pack test --node
      - name: Binaire statique musl (x86_64)
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Binaire statique musl (aarch64, zigbuild)
        run: |
          python -m pip install --user cargo-zigbuild
          cargo zigbuild --release --locked --target aarch64-unknown-linux-musl
      - name: Bundle statique UI (build wasm + copie dans static/)
        run: make ui-build
      - name: Arborescence dist/ (un binaire par architecture)
        run: |
          mkdir -p dist/amd64 dist/arm64
          cp target/x86_64-unknown-linux-musl/release/sav_server dist/amd64/sav_server
          cp target/aarch64-unknown-linux-musl/release/sav_server dist/arm64/sav_server
      - uses: actions/upload-artifact@v4
        with:
          name: sav-server-binaries
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ui-static
          path: ui/static/
          retention-days: 7

  # Image Docker multi-arch (linux/amd64 + linux/arm64): binaires
  # precompiles (pas de compilation Rust dans le conteneur, build rapide),
  # push vers GHCR hors pull requests.
  docker:
    name: Image Docker multi-arch (GHCR)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sav-server-binaries
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ui-static
          path: ui/static
      - name: Permissions des binaires
        run: chmod +x dist/*/sav_server
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sav-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
