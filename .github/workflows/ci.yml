name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build du binaire serveur + tests
  server:
    name: Serveur (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Tests
        run: cargo test --locked

  # Tests du module wasm + bundle statique (artefact pour l'image Docker)
  ui:
    name: Module wasm (tests + bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests (Node, sans navigateur)
        run: cd ui && wasm-pack test --node
      - name: Bundle statique (build wasm + copie dans static/)
        run: make ui-build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-static
          path: ui/static/
          retention-days: 7

  # Image Docker : build systematique, push vers GHCR hors pull requests
  docker:
    name: Image Docker (GHCR)
    needs: [server, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Recuperation du bundle UI (inclut pkg/)
        uses: actions/download-artifact@v4
        with:
          name: ui-static
          path: ui/static
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sav-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
