[package]
name = "sav_server"
version = "0.1.0"
edition = "2024"

# Monorepo : le serveur (ce package) + l'UI wasm (ui/).
# Les deux crates ne partagent aucun code : l'UI ne discute avec le serveur
# que via son API HTTP. Le build wasm se fait avec wasm-pack (voir ui/README.md).
# default-members : `cargo build` au racine ne compile que le serveur.
[workspace]
members = ["ui"]
default-members = ["."]
resolver = "2"

# Sources du serveur dans srv/ (layout non standard).
[[bin]]
name = "sav_server"
path = "srv/main.rs"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
chrono = "0.4"
chrono-tz = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
# rustls-tls: TLS purement Rust, binaire statique possible (image alpine/musl).
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.21"
ical = "0.11"
actix-governor = "0.10.0"
toml = "1.1.6"
actix-files = "0.7.0"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
