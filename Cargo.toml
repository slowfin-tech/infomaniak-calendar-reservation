[package]
name = "sav_server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
icalendar = "0.15"
reqwest = { version = "0.11", features = ["json"] }
